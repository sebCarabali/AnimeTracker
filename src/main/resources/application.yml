spring:
  application:
    name: animetracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/animetracker}
    username: ${DB_USERNAME:?Missing DB_USERNAME}
    password: ${DB_PASSWORD:?Missing DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Nunca ddl-auto para crear/actualizar esquema -- Flyway es la única
      # fuente de verdad del esquema (V1__..., etc). "validate" solo chequea
      # que las entidades JPA coincidan con lo que Flyway ya aplicó.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          anilist:
            client-id: ${ANILIST_CLIENT_ID:placeholder-client-id}
            client-secret: ${ANILIST_CLIENT_SECRET:placeholder-client-secret}
            client-authentication-method: post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/anilist"
            provider: anilist
        provider:
          anilist:
            authorization-uri: https://anilist.co/api/v2/oauth/authorize
            token-uri: https://anilist.co/api/v2/oauth/token
