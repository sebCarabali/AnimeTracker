<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnimeTracker — Iniciar sesión</title>
<style>
/*
  Tokens de diseño copiados 1:1 de mockups/login.html (UX-DR1).
  CSS embebido temporal: cuando se resuelva el pipeline de Tailwind
  (deferred-work.md) este bloque se reemplaza por clases utilitarias.
*/
:root{
  --surface-base:#0B0C10;
  --surface-raised:#16181D;
  --surface-sunken:#07080A;
  --ink-primary:#F2F1ED;
  --ink-secondary:#9B9CA3;
  --ink-disabled:#54565E;
  --border-hairline:#26282F;
  --accent:#FF6A47;
  --accent-fg:#160603;
  --danger:#E36767;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--surface-sunken);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  font-family:'Inter','Segoe UI',system-ui,sans-serif;
  color:var(--ink-primary);
}
.login-card{
  width:100%;
  max-width:420px;
  background:var(--surface-base);
  border-radius:12px;
  padding:48px 40px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:16px;
}
.brand{
  font-family:'Sora','Segoe UI',system-ui,sans-serif;
  font-size:22px;
  font-weight:600;
}
.body-text{
  font-size:15px;
  line-height:1.6;
  color:var(--ink-secondary);
  max-width:340px;
}
.error-banner{
  width:100%;
  font-size:14px;
  line-height:1.5;
  color:var(--danger);
  background:rgba(227,103,103,0.14);
  border-radius:8px;
  padding:12px 16px;
}
.btn-primary{
  display:inline-block;
  background:var(--accent);
  color:var(--accent-fg);
  border-radius:8px;
  padding:12px 24px;
  font-size:15px;
  font-weight:600;
  text-decoration:none;
  border:none;
  cursor:pointer;
  margin-top:8px;
}
.btn-primary:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}
.fine-print{
  font-size:13px;
  color:var(--ink-secondary);
  margin-top:20px;
}
</style>
</head>
<body>
<main class="login-card">
  <div class="brand">AnimeTracker</div>

  <div class="error-banner" role="status" aria-live="polite" th:if="${error}">
    No pudimos completar el inicio de sesión con AniList. Inténtalo de nuevo.
  </div>

  <p class="body-text" th:unless="${error}">Inicia sesión con tu cuenta de AniList para ver qué estás mirando.</p>

  <a class="btn-primary" href="/oauth2/authorization/anilist" th:text="${error} ? 'Reintentar con AniList' : 'Continuar con AniList'">Continuar con AniList</a>

  <p class="fine-print">Acceso solo por invitación — tu usuario de AniList tiene que estar habilitado.</p>
</main>
</body>
</html>
