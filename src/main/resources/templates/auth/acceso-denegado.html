<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnimeTracker — Acceso denegado</title>
<style>
/*
  Tokens de diseño copiados 1:1 de mockups/login.html, sección "Acceso
  denegado" (UX-DR12). CSS embebido temporal: mismo criterio que
  auth/login.html -- se reemplaza por clases utilitarias cuando el pipeline
  de Tailwind esté resuelto (deferred-work.md).
*/
:root{
  --surface-base:#0B0C10;
  --surface-raised:#16181D;
  --surface-sunken:#07080A;
  --ink-primary:#F2F1ED;
  --ink-secondary:#9B9CA3;
  --ink-disabled:#54565E;
  --border-hairline:#26282F;
  --accent:#FF6A47;
  --accent-fg:#160603;
  --danger:#E36767;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--surface-sunken);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  font-family:'Inter','Segoe UI',system-ui,sans-serif;
  color:var(--ink-primary);
}
.denied-card{
  width:100%;
  max-width:420px;
  background:var(--surface-base);
  border-radius:12px;
  padding:48px 40px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:16px;
}
.tag{
  font-size:11px;
  font-weight:600;
  letter-spacing:0.08em;
  text-transform:uppercase;
  padding:4px 12px;
  border-radius:9999px;
  background:rgba(227,103,103,0.14);
  color:var(--danger);
}
.headline{
  font-family:'Sora','Segoe UI',system-ui,sans-serif;
  font-size:22px;
  font-weight:600;
  line-height:1.2;
}
.body-text{
  font-size:15px;
  line-height:1.6;
  color:var(--ink-secondary);
  max-width:340px;
}
.btn-secondary{
  display:inline-block;
  background:transparent;
  color:var(--ink-primary);
  border:1px solid var(--border-hairline);
  border-radius:8px;
  padding:12px 24px;
  font-size:15px;
  font-weight:600;
  text-decoration:none;
  margin-top:8px;
}
.btn-secondary:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}
</style>
</head>
<body>
<main class="denied-card">
  <div class="tag">Acceso denegado</div>
  <h1 class="headline">Tu cuenta de AniList no está habilitada todavía.</h1>
  <p class="body-text">Pídele a quien administra AnimeTracker que agregue tu usuario de AniList a la lista de invitados.</p>
  <a class="btn-secondary" href="/login">Reintentar inicio de sesión</a>
</main>
</body>
</html>
